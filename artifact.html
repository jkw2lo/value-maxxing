<style>

  :root {

    --tier-1: #86b6ef; --tier-2: #3987e5; --tier-3: #1c5cab; --tier-4: #0d366b;

  @media (prefers-color-scheme: dark) {
    :root:not([data-vm-theme]):not([data-theme="light"]) {
      --ink: #e9eaf0; --ink-soft: #a7adba; --ink-faint: #737a89;
      --paper: #11141a; --card: #171b22; --rule: #262b35; --rule-strong: #384050;
      --accent: #59b696; --accent-ink: #0b1310; --accent-soft: #18271f;
      --shadow: none;
      --tier-1: #b7d3f6; --tier-2: #6da7ec; --tier-3: #2a78d6; --tier-4: #184f95;
      --status-warning: #fab219; --status-serious: #ec835a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]:not([data-vm-theme]) {
      --ink: #e9eaf0; --ink-soft: #a7adba; --ink-faint: #737a89;
      --paper: #11141a; --card: #171b22; --rule: #262b35; --rule-strong: #384050;
      --accent: #59b696; --accent-ink: #0b1310; --accent-soft: #18271f;
      --shadow: none;
      --tier-1: #b7d3f6; --tier-2: #6da7ec; --tier-3: #2a78d6; --tier-4: #184f95;

  }
  :root[data-vm-theme='night'] {
    --ink: #e9eaf0; --ink-soft: #a7adba; --ink-faint: #737a89;
    --paper: #11141a; --card: #171b22; --rule: #262b35; --rule-strong: #384050;
    --accent: #59b696; --accent-ink: #0b1310; --accent-soft: #18271f;
    --shadow: none;
    --tier-1: #b7d3f6; --tier-2: #6da7ec; --tier-3: #2a78d6; --tier-4: #184f95;

  }
  :root[data-vm-theme='graphite'] {
    --font-head: -apple-system, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;

    --ink: #ededed; --ink-soft: #a8a8a8; --ink-faint: #767676;
    --paper: #141414; --card: #1c1c1c; --rule: #2b2b2b; --rule-strong: #3d3d3d;
    --accent: #e3a83b; --accent-ink: #1a1203; --accent-soft: #2a2316;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  /* ---------- app shell: reports sidebar + main panel ---------- */
  :root { --main-pad: 40px; --side-w: 264px; }
  @media (max-width: 1180px) { :root { --main-pad: 28px; } }
  @media (max-width: 560px) { :root { --main-pad: 16px; } }
  .vm-shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
  .vm-main { min-width: 0; padding-block: 24px 80px; padding-left: var(--main-pad); padding-right: max(var(--main-pad), env(safe-area-inset-right, 0px)); }
  .vm-main > #vm-body { max-width: 1120px; margin: 0 auto; }
  .vm-side { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-block: max(20px, env(safe-area-inset-top, 0px)) 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; background: var(--card); border-right: 1px solid var(--rule); }
  .vm-side-top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .vm-side-top .vm-title { flex: 1 1 100%; font-size: 22px; padding: 0 4px; }
  .vm-side-toggle { display: none; }
  .vm-side-new { flex: 1 1 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; }
  .vm-side-new span { font-size: 18px; line-height: 1; font-weight: 500; }
  .vm-side-new i { font-style: normal; }
  .vm-side-new b { font-weight: inherit; }
  .vm-side-panel { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
  .vm-side-search { width: 100%; font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink); }
  .vm-side-search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .vm-side-label { margin: 8px 4px 0; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
  .vm-side-label span { font-weight: 600; letter-spacing: 0; }
  .vm-side-list { display: flex; flex-direction: column; gap: 2px; }
  .vm-side-item { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .vm-side-item:hover { background: var(--paper); }
  .vm-side-item[aria-current="true"] { background: var(--accent-soft); }
  .vm-side-item-cat { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vm-side-item-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; white-space: nowrap; overflow: hidden; }
  .vm-side-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .vm-side-empty { font-size: 12.5px; color: var(--ink-faint); margin: 0 4px; line-height: 1.45; }
  .vm-side-example .vm-side-item-cat { font-weight: 500; }
  .vm-side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .vm-side-link { background: none; border: 0; font: inherit; font-size: 13px; color: var(--ink-soft); padding: 6px 4px; cursor: pointer; text-align: left; }
  .vm-side-link:hover { color: var(--ink); }
  .vm-side-foot .vm-theme-wrap { margin-top: 6px; }
  .vm-side-foot .vm-theme-pop { top: auto; bottom: calc(100% + 6px); left: 0; right: auto; }
  @media (max-width: 900px) {
    .vm-shell { display: block; }
    .vm-side { position: static; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--rule); padding-block: max(12px, env(safe-area-inset-top, 0px)) 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; }
    .vm-side-top { flex-wrap: nowrap; gap: 8px; }
    .vm-side-top .vm-title { flex: 1 1 auto; font-size: 20px; padding: 0; white-space: nowrap; }
    .vm-side-toggle { display: inline-flex; align-items: center; gap: 6px; flex: none; border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink); border-radius: 7px; padding: 8px 12px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
    .vm-side-toggle::after { content: "\25be"; font-size: 11px; color: var(--ink-faint); }
    .vm-side-toggle[aria-expanded="true"]::after { content: "\25b4"; }
    .vm-side-new { flex: none; padding: 8px 12px; font-size: 13.5px; }
    .vm-side-panel { display: none; }
    .vm-side.vm-side-open .vm-side-panel { display: flex; max-height: 60vh; overflow-y: auto; }
    .vm-side-foot .vm-theme-pop { top: calc(100% + 6px); bottom: auto; }
  }
  @media (max-width: 420px) { .vm-side-new { padding: 8px 10px; } .vm-side-new b { display: none; } }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  .vm-form, .vm-stream, .vm-error { max-width: 640px; margin-left: auto; margin-right: auto; }
  .vm-num, .vm-price, td.vm-num-cell, .vm-tick { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .vm-mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; }

  /* ---------- header / receipt tear ---------- */
  .vm-masthead { display:flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  .vm-title {
    font-family: var(--font-head);
    font-weight: 700; font-size: 28px; letter-spacing: -0.01em; margin: 0;
  }
  .vm-title span { color: var(--accent); }
  .vm-sub { color: var(--ink-soft); font-size: 13.5px; margin: 2px 0 0; max-width: 46ch; }
  .vm-theme-toggle {
    border: 1px solid var(--rule-strong); background: var(--card); color: var(--ink-soft);
    border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .vm-tear {
    height: 14px; margin: 18px 0 22px;
    background-image: radial-gradient(circle at 7px 7px, var(--paper) 5px, transparent 5.5px);
    background-size: 14px 14px; background-position: 0 -7px;
    border-bottom: 1px solid var(--rule);
  }

  /* ---------- form ---------- */
  .vm-form { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .vm-form label { display:block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 6px; }
  .vm-form input, .vm-form textarea {
    width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 7px;
    border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink); resize: vertical;
  }
  .vm-form input:focus, .vm-form textarea:focus, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .vm-field { margin-bottom: 14px; }
  .vm-row { display:flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .vm-btn {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 7px;
    padding: 11px 18px; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  .vm-btn:disabled { opacity: 0.5; cursor: default; }
  .vm-btn-ghost {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--rule-strong); border-radius: 7px;
    padding: 10px 14px; font-size: 13.5px; cursor: pointer;
  }
  .vm-link-btn { background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; }
  .vm-fallback { margin-top: 14px; }
  .vm-fallback textarea { min-height: 90px; font-family: ui-monospace, monospace; font-size: 12.5px; }

  /* ---------- streaming: coin spinner + status ---------- */
  .vm-stream { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 26px 20px; margin-top: 18px; box-shadow: var(--shadow); text-align: center; }
  .vm-coin-spinner { perspective: 240px; display: flex; justify-content: center; margin-bottom: 16px; }
  .vm-coin {
    width: 44px; height: 44px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-family: var(--font-head); font-weight: 700; font-size: 20px; color: var(--accent-ink);
    background: linear-gradient(135deg, var(--accent), var(--tier-3));
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), var(--shadow);
    animation: vm-coin-spin 1.3s linear infinite;
  }
  @keyframes vm-coin-spin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
  .vm-stream-phase { font-size: 13.5px; font-weight: 600; color: var(--ink); margin: 0 0 4px; }
  .vm-stream-substatus { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 18px; min-height: 1.4em; transition: opacity 0.25s ease; }
  .vm-log { max-height: 200px; overflow-y: auto; font-size: 12.5px; color: var(--ink-soft); text-align: left; border-top: 1px solid var(--rule); padding-top: 10px; }
  .vm-log:empty { display: none; }
  .vm-log-line { padding: 5px 0; border-bottom: 1px dashed var(--rule); display: flex; gap: 8px; }
  .vm-log-line:last-child { border-bottom: none; }
  .vm-log-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--tier-3); flex-shrink: 0; padding-top: 1px; }

  /* ---------- error ---------- */
  .vm-error { background: var(--card); border: 1px solid var(--status-critical); border-radius: var(--radius); padding: 18px 20px; margin-top: 18px; }
  .vm-error h3 { margin: 0 0 6px; color: var(--status-critical); font-size: 15px; }
  .vm-error p { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-soft); }

  /* ---------- report shell ---------- */
  .vm-report { margin-top: 6px; }
  .vm-eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin: 0 0 4px; }
  .vm-section { margin: 0 0 14px; scroll-margin-top: 76px; }
  .vm-card { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .vm-report p { overflow-wrap: anywhere; }
  .vm-report svg { display: block; max-width: 100%; height: auto; }
  .vm-chart-block svg { width: 100%; }

  /* ---------- summary: the short version (always first, always visible) ---------- */
  .vm-summary { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 8px; scroll-margin-top: 76px; }
  .vm-summary-top { background: var(--accent); color: var(--accent-ink); padding: 26px 28px 24px; }
  .vm-summary-kicker { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; margin: 0 0 8px; font-weight: 600; }
  .vm-summary-title { font-family: var(--font-head); font-size: clamp(26px, 4.2vw, 38px); line-height: 1.12; margin: 0 0 10px; letter-spacing: -0.01em; }
  .vm-summary-scope { font-size: 14.5px; line-height: 1.55; opacity: 0.92; margin: 0; max-width: 78ch; }
  .vm-summary-meta { font-size: 12px; opacity: 0.75; margin: 12px 0 0; }
  .vm-summary-body { padding: 24px 28px 20px; }
  .vm-summary-call { padding: 0 28px 24px; }
  .vm-summary-deals { padding: 0 28px 24px; }
  @media (max-width: 760px) { .vm-summary-top, .vm-summary-body, .vm-summary-picks, .vm-summary-call, .vm-summary-deals { padding-left: 18px; padding-right: 18px; } }
  .vm-summary-conf { font-size: 12.5px; line-height: 1.45; color: var(--ink-faint); margin: 12px 0 0; }
  .vm-summary-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 0 8px; }
  .vm-summary-headline { font-family: var(--font-head); font-size: 21px; line-height: 1.38; font-weight: 700; margin: 0 0 12px; }
  .vm-summary-reasoning { font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 14px; }
  /* the call: strike price + buy now / wait */
  .vm-call { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); overflow: hidden; }
  .vm-call-one { grid-template-columns: minmax(0, 1fr); }
  .vm-call-strike { padding: 16px 20px 18px; border-right: 1px solid var(--rule); text-align: center; min-width: 0; }
  .vm-call-act { padding: 16px 22px 18px; min-width: 0; }

  .vm-call p { margin: 0; overflow-wrap: break-word; }
  .vm-call .vm-call-k { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 8px; text-align: left; }
  .vm-dial { display: block; margin: 0 auto 4px; max-width: 100%; height: auto; }
  .vm-call .vm-call-big { font-family: var(--font-head); font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .vm-call-big span { font-family: var(--font-body); font-size: 14px; font-weight: 400; color: var(--ink-soft); }
  .vm-call .vm-call-sub { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }
  .vm-call .vm-call-note { font-size: 12.5px; color: var(--ink-faint); margin-top: 10px; }
  .vm-call .vm-call-verb { font-family: var(--font-head); font-size: 23px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; text-wrap: balance; }
  .vm-tone-good { color: color-mix(in srgb, var(--status-good) 72%, var(--ink)); }
  .vm-tone-warning { color: color-mix(in srgb, var(--status-warning) 70%, var(--ink)); }
  .vm-tone-critical { color: color-mix(in srgb, var(--status-critical) 80%, var(--ink)); }
  .vm-call .vm-call-item { font-size: 16px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; }
  .vm-call .vm-call-line { font-size: 14px; line-height: 1.5; margin-bottom: 3px; }
  .vm-call .vm-call-why { font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); margin-top: 8px; }
  .vm-call .vm-call-alt { font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--rule-strong); }
  .q-verdict .vm-call { margin-top: 18px; }
  table.q-table td small, .vm-deal-note { display: block; font-size: 12px; line-height: 1.35; color: var(--ink-faint); font-weight: 400; margin-top: 2px; }
  table.q-table td.q-ok { color: color-mix(in srgb, var(--status-good) 72%, var(--ink)); font-weight: 600; }
  table.vm-deals td:last-child, table.vm-deals th:last-child { white-space: nowrap; padding-left: 18px; padding-right: 0; }
  table.vm-deals + * , .q-wrap + .q-sub { margin-top: 8px; }
  table.vm-deals a { color: var(--accent); }
  .vm-keyfacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--rule); border-top: 1px solid var(--rule); }
  .vm-keyfact { background: var(--card); padding: 16px 20px; min-width: 0; }
  .vm-keyfact-label { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 5px; font-weight: 600; }
  .vm-keyfact-value { font-size: 15.5px; font-weight: 700; margin: 0; line-height: 1.3; }
  .vm-keyfact-long { font-size: 13.5px; line-height: 1.5; margin: 0; color: var(--ink); }
  .vm-keyfact-note { font-size: 12.5px; color: var(--ink-soft); margin: 4px 0 0; line-height: 1.45; }
  .vm-summary-picks { padding: 22px 28px 26px; border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 55%, var(--card)); }
  .vm-summary .vm-h2h { box-shadow: none; }

  .vm-analysis-head { display: flex; align-items: baseline; gap: 14px; margin: 44px 0 18px; }
  .vm-analysis-head h2 { font-family: var(--font-head); font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0; color: var(--ink-soft); white-space: nowrap; }
  .vm-analysis-head span { flex: 1; border-top: 1px solid var(--rule-strong); }

  /* ---------- part dividers (group sections so they stop blending together) ---------- */
  .vm-part { margin: 38px 0 14px; scroll-margin-top: 76px; }
  .vm-part:first-child { margin-top: 0; }
  .vm-part-row { display: flex; align-items: center; gap: 12px; }
  .vm-part-num { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); padding: 4px 9px; border-radius: 4px; white-space: nowrap; }
  .vm-part-title { font-family: var(--font-head); font-size: 23px; font-weight: 700; margin: 0; line-height: 1.2; }
  .vm-part-rule { flex: 1; min-width: 16px; height: 2px; background: var(--rule-strong); }
  .vm-part-desc { font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 0; }

  /* ---------- start here: primer ---------- */
  .vm-primer-intro { font-family: var(--font-head); font-size: 17px; line-height: 1.55; margin: 0 0 20px; }
  .vm-primer-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  @media (max-width: 900px) { .vm-primer-grid { grid-template-columns: minmax(0, 1fr); } }
  .vm-primer-col h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; display:flex; align-items:center; gap:6px; }
  .vm-primer-col ul { margin: 0; padding-left: 18px; }
  .vm-primer-col li { font-size: 13.5px; margin-bottom: 9px; line-height: 1.45; }
  .vm-primer-musthave { border-left: 3px solid var(--accent); padding-left: 14px; }
  .vm-primer-musthave h4 { color: var(--accent); }
  .vm-primer-premium { border-left: 3px solid var(--tier-3); padding-left: 14px; }
  .vm-primer-premium h4 { color: var(--tier-3); }
  .vm-primer-avoid { border-left: 3px solid var(--status-critical); padding-left: 14px; }
  .vm-primer-avoid h4 { color: var(--status-critical); }

  /* ---------- head-to-head: best of class vs best value ---------- */
  .vm-h2h { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 18px; align-items: center; background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  @media (max-width: 640px) { .vm-h2h { grid-template-columns: minmax(0, 1fr); } .vm-h2h-divider { justify-self: center; } }
  .vm-h2h-col { text-align: center; min-width: 0; }
  .vm-h2h-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin: 0 0 8px; font-weight: 600; }
  .vm-h2h-product { font-family: var(--font-head); font-size: 20px; font-weight: 700; margin: 0 0 8px; line-height: 1.28; }
  .vm-h2h-why { font-size: 13.5px; color: var(--ink-soft); margin: 0; line-height: 1.5; }
  .vm-h2h-overall .vm-h2h-label { color: var(--accent); }
  .vm-h2h-value .vm-h2h-label { color: var(--tier-3); }
  .vm-h2h-divider { font-family: var(--font-head); font-size: 13px; color: var(--ink-faint); border: 1px solid var(--rule-strong); border-radius: 50%; width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; }

  /* ---------- secondary awards ---------- */
  .vm-awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 12px; }
  .vm-award { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
  .vm-award.vm-avoid { border-color: var(--status-critical); border-width: 1.5px; }
  .vm-award.vm-avoid .vm-award-label { color: var(--status-critical); }
  .vm-award-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin: 0 0 6px; font-weight: 600; }
  .vm-award-product { font-weight: 700; font-size: 14px; margin: 0 0 4px; line-height: 1.35; }
  .vm-sort { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
  .vm-sort:hover { color: var(--ink); }
  .vm-na { color: var(--ink-faint); font-weight: 400; }
  .vm-calc { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin: 22px 0; }
  .vm-quick .vm-calc { box-shadow: none; background: var(--paper); margin: 30px 0 8px; }
  .vm-calc-head h3 { margin: 0 0 4px; font-family: var(--font-head); font-weight: var(--head-weight); font-size: 19px; }
  .vm-calc-head p { margin: 0 0 14px; font-size: 13.5px; color: var(--ink-soft); }
  .vm-calc-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .vm-calc-row { border: 1px solid var(--rule); border-radius: 10px; padding: 12px; background: var(--card); }
  .vm-calc-row.vm-calc-best { border-color: var(--status-good); box-shadow: inset 0 0 0 1px var(--status-good); }
  .vm-calc-row.vm-calc-best .vm-calc-out::before { content: "Best of these"; display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--status-good); margin-right: 8px; }
  .vm-calc-inputs { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(90px, 0.6fr) minmax(90px, 0.6fr) auto; gap: 10px; align-items: end; }
  .vm-calc-inputs label > span:first-child { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px; }
  .vm-calc-inputs select, .vm-calc-inputs input { width: 100%; font: inherit; font-size: 14.5px; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink); min-width: 0; }
  .vm-calc-inputs input { font-variant-numeric: tabular-nums; }
  .vm-calc-pre { position: relative; display: block; }
  .vm-calc-pre i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink-faint); pointer-events: none; }
  .vm-calc-pre input { padding-left: 22px; }
  .vm-calc-x { border: 0; background: none; font-size: 20px; line-height: 1; color: var(--ink-faint); cursor: pointer; padding: 8px 6px; }
  .vm-calc-x:hover { color: var(--status-critical); }
  .vm-calc-out { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .vm-calc-out:not(:empty) { margin-top: 10px; }
  .vm-calc-badge { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; margin-right: 8px; }
  .vm-calc-great { background: color-mix(in srgb, var(--status-good) 18%, transparent); color: var(--status-good); }
  .vm-calc-good { background: color-mix(in srgb, var(--status-good) 10%, transparent); color: var(--status-good); }
  .vm-calc-fair { background: color-mix(in srgb, var(--status-warning) 16%, transparent); color: var(--ink); }
  .vm-calc-poor { background: color-mix(in srgb, var(--status-critical) 14%, transparent); color: var(--status-critical); }
  .vm-calc-unit { font-weight: 700; color: var(--ink); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .vm-calc-why { display: block; margin-top: 3px; }
  .vm-calc-hint { color: var(--ink-faint); }
  @media (max-width: 640px) { .vm-calc { padding: 16px; } .vm-calc-inputs { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; } .vm-calc-prod { grid-column: 1 / -1; } }
  .vm-est { font-size: 11px; font-weight: 600; color: var(--ink-faint); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
  .vm-sort[data-dir="asc"]::after { content: " \2191"; }
  .vm-sort[data-dir="desc"]::after { content: " \2193"; }
  .vm-award-more summary { font-size: 12px; color: var(--accent); cursor: pointer; margin-top: 4px; }
  .vm-award-more[open] summary { margin-bottom: 4px; }
  .vm-award-why { font-size: 12.5px; color: var(--ink-soft); margin: 0; line-height: 1.45; }

  /* ---------- timing badge ---------- */
  .vm-signal-badge { display: inline-flex; align-items:center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 10px; border-radius: 20px; white-space: nowrap; }
  .vm-timing-badge { display:flex; align-items:flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .vm-timing-note { font-size: 13.5px; color: var(--ink-soft); flex: 1; min-width: 200px; line-height: 1.5; }

  /* ---------- expertise selector ---------- */
  .vm-expertise-group { display:flex; gap: 8px; flex-wrap: wrap; }
  .vm-expertise-opt { flex: 1; min-width: 120px; }
  .vm-expertise-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .vm-expertise-opt span {
    display: block; text-align: center; padding: 10px 8px; border-radius: 7px; border: 1px solid var(--rule-strong);
    background: var(--paper); color: var(--ink-soft); font-size: 13px; cursor: pointer; user-select: none;
  }
  .vm-expertise-opt input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
  .vm-expertise-opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- price expectations ladder ---------- */
  .vm-priceexp-headline { font-family: var(--font-head); font-size: 20px; font-weight: 700; margin: 0 0 4px; line-height: 1.3; }
  .vm-priceexp-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 8px; line-height: 1.5; }
  .vm-ladder-wrap { margin: 14px 0 6px; padding-top: 30px; }
  .vm-ladder { position: relative; display: flex; height: 30px; border-radius: 6px; border: 1px solid var(--rule-strong); }
  .vm-ladder-seg { display:flex; align-items:center; justify-content:center; font-size: 11px; color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 4px; border-right: 1px solid var(--card); text-shadow: 0 1px 1px rgba(0,0,0,0.25); }
  .vm-ladder-seg:first-child { border-radius: 5px 0 0 5px; }
  .vm-ladder-seg:last-child { border-right: none; border-radius: 0 5px 5px 0; }
  .vm-ladder-knee { position: absolute; top: -30px; font-size: 11px; text-align: center; color: var(--ink); line-height: 1.25; white-space: nowrap; font-weight: 600; }
  .vm-ladder-knee-line { position: absolute; top: -3px; width: 2px; height: 34px; background: var(--ink); transform: translateX(-50%); }
  .vm-ladder-ticks { display:flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); margin-top: 5px; }
  .vm-ladder-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
  .vm-ladder-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .vm-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .vm-priceexp-tiers { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 10px; margin-top: 18px; }
  .vm-priceexp-tier { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .vm-priceexp-tier-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 5px; font-weight: 700; line-height: 1.35; }
  .vm-priceexp-tier-price { font-weight: 700; font-size: 15px; margin: 0 0 4px; }
  .vm-priceexp-tier-verdict { font-size: 12.5px; color: var(--ink-soft); margin: 0; line-height: 1.45; }

  /* ---------- reusable content blocks ---------- */
  .vm-sub-h { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 26px 0 12px; padding-top: 20px; border-top: 1px solid var(--rule); }
  .vm-sub-h:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .vm-notes2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
  .vm-note { border-radius: 8px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--rule); font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); min-width: 0; }
  .vm-note-label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }
  .vm-def { margin: 0 0 16px; }
  .vm-def-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 3px; }
  .vm-def-value { font-size: 16px; font-weight: 700; margin: 0 0 4px; line-height: 1.35; }
  .vm-def-text { font-size: 14px; color: var(--ink-soft); margin: 0; line-height: 1.55; }
  .vm-formula { font-family: ui-monospace, "SF Mono", Consolas, monospace; background: var(--accent-soft); padding: 10px 12px; border-radius: 6px; font-size: 13px; margin: 8px 0 0; line-height: 1.5; overflow-wrap: anywhere; }
  .vm-knee { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border-radius: 8px; padding: 14px 16px; margin-top: 14px; }
  .vm-knee-num { font-family: var(--font-head); font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1; }
  .vm-knee-text { flex: 1; min-width: 200px; font-size: 13.5px; line-height: 1.5; }
  .vm-footnote { font-size: 12.5px; color: var(--ink-faint); margin: 14px 0 0; line-height: 1.5; }

  /* ---------- table of contents (left panel) ---------- */
  .vm-report-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 26px; align-items: start; }
  .vm-report-toc-col { position: sticky; top: 74px; }
  .vm-toc { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow); max-height: calc(100vh - 92px); overflow-y: auto; }
  .vm-toc-group { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 10px 9px 2px; }
  .vm-toc-item {
    display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; align-items: baseline; width: 100%; text-align: left;
    background: none; border: none; padding: 7px 9px; border-radius: 6px; cursor: pointer; font: inherit; color: var(--ink);
  }
  .vm-toc-item:hover, .vm-toc-item.vm-toc-active { background: var(--accent-soft); }
  .vm-toc-num { font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .vm-toc-title { font-weight: 600; font-size: 13px; color: var(--ink); display:block; line-height: 1.3; }
  .vm-toc-takeaway { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 980px) {
    .vm-report-layout { grid-template-columns: minmax(0, 1fr); }
    .vm-report-toc-col { position: static; }
    .vm-toc { display: flex; flex-wrap: wrap; gap: 4px; max-height: none; }
    .vm-toc-group, .vm-toc-takeaway, .vm-toc-num { display: none; }
    .vm-toc-item { width: auto; display: block; padding: 6px 10px; border: 1px solid var(--rule); }
  }

  /* ---------- report toolbar ---------- */
  .vm-report-toolbar { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .vm-toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .vm-saved-status { font-size: 13px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 8px; }
  .vm-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--status-good); flex: none; }
  .vm-dot-off { background: var(--ink-faint); }
  .vm-btn-sm { padding: 8px 13px; font-size: 13px; }

  /* ---------- My reports library ---------- */
  .vm-lib { max-width: 860px; margin: 0 auto; }
  .vm-lib-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .vm-lib-title { font-family: var(--font-head); font-size: 24px; margin: 0; }
  .vm-lib-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .vm-lib-search { flex: 1; min-width: 200px; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 7px; border: 1px solid var(--rule-strong); background: var(--card); color: var(--ink); }
  .vm-lib-settings { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: var(--ink-soft); }
  .vm-check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; color: var(--ink); font-size: 13.5px; line-height: 1.45; }
  .vm-check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .vm-check small { display: block; color: var(--ink-soft); font-size: 12.5px; }
  .vm-saved-list { display: flex; flex-direction: column; gap: 10px; }
  .vm-saved-item {
    background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px;
    box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .vm-saved-item-main { min-width: 0; flex: 1 1 320px; }
  .vm-saved-item-cat { font-family: var(--font-head); font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .vm-saved-item-meta { font-size: 12px; color: var(--ink-faint); margin: 0 0 5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .vm-saved-item-picks { font-size: 12.5px; color: var(--ink-soft); margin: 0; line-height: 1.45; }
  .vm-saved-item-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; flex-wrap: wrap; }
  .vm-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; }
  .vm-tag { font-size: 11px; border: 1px solid var(--rule-strong); border-radius: 20px; padding: 1px 8px; color: var(--ink-soft); }
  .vm-saved-empty { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 30px 10px; }
  .vm-recent { max-width: 780px; margin: 0 auto 20px; }
  .vm-recent-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; }
  .vm-recent-head h2 { font-size: 15px; margin: 0; }
  .vm-recent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .vm-recent-card { text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
  .vm-recent-card:hover { border-color: var(--accent); }
  .vm-recent-cat { font-family: var(--font-head); font-weight: 700; font-size: 15px; margin: 0 0 3px; display: block; }
  .vm-recent-meta { font-size: 12px; color: var(--ink-faint); display: block; }
  .vm-drop-hint { font-size: 12.5px; color: var(--ink-faint); text-align: center; margin: 10px 0 0; }
  .vm-dropping::after { content: "Drop report files to open them"; position: fixed; inset: 12px; border: 3px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--paper) 85%, transparent); display: flex; align-items: center; justify-content: center; font-size: 20px; font-family: var(--font-head); color: var(--accent); z-index: 200; pointer-events: none; }

  .vm-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; max-width: calc(100vw - 32px); text-align: center;
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 20px; font-size: 13px;
    box-shadow: var(--shadow); transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none; z-index: 100;
  }
  .vm-toast.vm-toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- accordion sections ---------- */
  .vm-accordion { border: 1px solid var(--rule); border-left: 4px solid var(--rule-strong); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 76px; }
  .vm-accordion.vm-open { border-left-color: var(--accent); }
  .vm-accordion-head {
    width: 100%; display:flex; align-items: center; gap: 14px; background: none; border: none; cursor: pointer;
    padding: 15px 18px; text-align: left; font: inherit; color: var(--ink);
  }
  .vm-accordion-head:hover { background: color-mix(in srgb, var(--accent-soft) 50%, transparent); }
  .vm-accordion.vm-open .vm-accordion-head { background: var(--accent-soft); border-bottom: 1px solid var(--rule); }
  .vm-accordion-num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-variant-numeric: tabular-nums; }
  .vm-accordion.vm-open .vm-accordion-num { background: var(--accent); color: var(--accent-ink); }
  .vm-accordion-title-wrap { flex: 1; min-width: 0; }
  .vm-accordion-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; margin: 0; display: block; line-height: 1.3; }
  .vm-accordion-takeaway { display: block; font-size: 13px; color: var(--ink-soft); margin: 3px 0 0; line-height: 1.4; }
  .vm-accordion.vm-open .vm-accordion-takeaway { display: none; }
  .vm-accordion-chevron { flex-shrink: 0; font-size: 13px; color: var(--ink-faint); transition: transform 0.15s ease; }
  .vm-accordion.vm-open .vm-accordion-chevron { transform: rotate(180deg); }
  .vm-accordion-body { display: none; padding: 20px 22px 24px; }
  .vm-accordion.vm-open .vm-accordion-body { display: block; }

  /* ---------- report bar (sticky): back, length toggle, saved, download ---------- */

        if (typeof o[i] === "string") { o[i] = tidyText(o[i]); if (!o[i]) o.splice(i, 1); }
        else tidyAll(o[i], key);
      }
    } else if (o && typeof o === "object") {
      Object.keys(o).forEach(function (k) {
        if (TIDY_SKIP[k] || k.charAt(0) === "_") return;
        if (typeof o[k] === "string") o[k] = tidyText(o[k]);
        else tidyAll(o[k], k);
      });
    }
  }

  // ------------------------------------------------------------
  // The call: (1) a strike price for one specific item, (2) buy it now or
  // wait. New reports carry r.recommendation; older ones derive it from the
  // best-value pick and the products' buy-under prices.
  // ------------------------------------------------------------
  function byValue(x, y) { return (y.value_score || 0) - (x.value_score || 0); }
  function atStrike(p) { return p.street_price != null && p.buy_under != null && p.street_price <= p.buy_under * 1.005; }
  function buildCall(r) {
    var rec = r.recommendation, v = r.verdict, a = r.awards;
    var avoidP = a.avoid.product ? matchProduct(r.products, a.avoid.product) : null;
    var cands = r.products.filter(function (p) { return p.buy_under != null && p !== avoidP; });
    var pref = [a.best_value.product, a.best_overall.product].map(function (nm) { return nm ? matchProduct(cands, nm) : null; }).filter(Boolean)[0] ||
      cands.slice().sort(byValue)[0] || null;
    var c = { derived: !rec.product, action: "", p: null, name: "", retailer: "", now: null, strike: null, pack: null, strikeUnit: null, waitFor: "", why: "", alt: null };
    if (rec.product) {
      c.p = matchProduct(r.products, rec.product);
      c.action = rec.action || "WAIT"; c.name = rec.product; c.retailer = rec.retailer;
      c.now = rec.current_price; c.strike = rec.strike_price; c.pack = rec.pack_size; c.strikeUnit = rec.strike_unit_price;
      c.waitFor = rec.wait_for; c.why = rec.why;
    } else {
      if (!pref) return null;
      var pick = pref;
      if (v.signal === "AVOID_CATEGORY") c.action = "SKIP";
      else if (v.signal === "WAIT_FOR_SALE") c.action = "WAIT";
      else if (atStrike(pref)) c.action = "BUY_NOW";
      else {
        var hit = cands.filter(atStrike).sort(byValue)[0];
        if (hit) { c.action = "BUY_NOW"; pick = hit; c.alt = pref; } else c.action = "WAIT";
      }
      c.p = pick; c.name = pick.name;
      var aw = [a.best_value, a.best_overall, a.best_budget, a.best_for_beginners, a.best_premium].filter(function (x) { return x.product && matchProduct([pick], x.product); })[0];
      c.why = c.action === "SKIP" ? firstSentence(v.reasoning) : aw && aw.why ? firstSentence(aw.why) : pick.best_for || "";
    }
    var p = c.p;
    if (p) {
      if (c.now == null) { c.now = p.street_price; c.nowEst = isEst(p); }
      if (c.strike == null) c.strike = p.buy_under;
      if (c.pack == null) c.pack = p.pack_size;
      if (!c.retailer) c.retailer = p.where_to_buy[0] || "";
    }
    if (c.strikeUnit == null && c.strike != null && c.pack) c.strikeUnit = c.strike / c.pack;
    if (c.action === "WAIT" && !c.waitFor) {
      var sc = r.deal_intelligence.sale_cadence.filter(function (x) { return x.event; })[0];
      if (sc) c.waitFor = sc.event + (sc.timing ? " (" + firstSentence(sc.timing).replace(/[.;]$/, "") + ")" : "");
    }
    // A stored call can disagree with its own numbers; trust the numbers.
    if (c.action === "BUY_NOW" && c.now != null && c.strike != null && c.now > c.strike * 1.08) c.action = "WAIT";
    return c;
  }
  function strikeGap(c) {
    if (c.now == null || c.strike == null || !c.strike) return null;
    var d = (c.now - c.strike) / c.strike;
    return { d: d, text: Math.abs(d) < 0.005 ? "At the strike price" : Math.round(Math.abs(d) * 100) + "% " + (d > 0 ? "above" : "below") + " the strike price" };
  }
  var CALL_META = {
    BUY_NOW: { verb: "Buy now", cls: "good" },
    WAIT: { verb: "Wait for a better price", cls: "warning" },
    SKIP: { verb: "Skip this category", cls: "critical" }
  };

  // Price meter: where today's price sits against the strike price.
  function priceDialSVG(c) {
    if (c.now == null || c.strike == null) return "";
    var s = c.strike, lo = Math.min(s * 0.8, c.now * 0.95), hi = Math.max(s * 1.3, c.now * 1.08);
    var cx = 110, cy = 108, rad = 80;
    function ang(x) { return Math.PI - Math.max(0, Math.min(1, (x - lo) / (hi - lo))) * Math.PI; }
    function pt(a, rr) { return [cx + rr * Math.cos(a), cy - rr * Math.sin(a)]; }
    function arc(x0, x1, color) {
      var p0 = pt(ang(x0), rad), p1 = pt(ang(x1), rad);
      return '<path d="M ' + p0[0].toFixed(1) + " " + p0[1].toFixed(1) + " A " + rad + " " + rad + " 0 0 1 " + p1[0].toFixed(1) + " " + p1[1].toFixed(1) + '" stroke="' + color + '" stroke-width="13" fill="none"/>';
    }
    var amberTo = Math.min(hi, s * 1.12);
    var zones = arc(lo, s, "var(--status-good)") + arc(s, amberTo, "var(--status-warning)") + (hi > amberTo ? arc(amberTo, hi, "var(--status-critical)") : "");
    var ta = ang(s), t0 = pt(ta, rad - 11), t1 = pt(ta, rad + 11), tl = pt(ta, rad + 15);
    var tick = '<line x1="' + t0[0].toFixed(1) + '" y1="' + t0[1].toFixed(1) + '" x2="' + t1[0].toFixed(1) + '" y2="' + t1[1].toFixed(1) + '" stroke="var(--ink)" stroke-width="2.5"/>' +
      '<text x="' + tl[0].toFixed(1) + '" y="' + (tl[1] + 3).toFixed(1) + '" text-anchor="' + (tl[0] < cx - 8 ? "end" : tl[0] > cx + 8 ? "start" : "middle") + '" font-size="10.5" font-weight="700" fill="var(--ink)">Strike</text>';
    var na = ang(c.now), np = pt(na, rad - 18);
    var g = strikeGap(c);
    var big = Math.abs(g.d) < 0.005 ? "At strike" : Math.round(Math.abs(g.d) * 100) + "% " + (g.d > 0 ? "over" : "under");
    return '<svg class="vm-dial" viewBox="0 0 220 140" width="200" role="img" aria-label="Today ' + esc(fmtMoney(c.now)) + ", strike " + esc(fmtMoney(c.strike)) + ": " + esc(g.text) + '">' +
      zones + tick +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + np[0].toFixed(1) + '" y2="' + np[1].toFixed(1) + '" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="var(--ink)"/>' +
      '<text x="' + cx + '" y="' + (cy + 25) + '" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">' + esc(big) + "</text>" +
      "</svg>";
  }

  function callHTML(r, o) {
    o = o || {};
    var c = buildCall(r);
    if (!c) return "";
    var u = r.normalization.unit_short, m = CALL_META[c.action] || CALL_META.WAIT;
    var g = strikeGap(c), money = function (n) { return (c.nowEst ? "~" : "") + fmtMoney(n); };
    var packTxt = c.pack ? Math.round(c.pack) + " " + unitPlural(u, Math.round(c.pack)) : "";
    var strikeCol = c.action === "SKIP" || c.strike == null ? "" :
      '<p class="vm-call-k">1 · Strike price</p>' +
      (o.doc ? "" : priceDialSVG(c)) +
      '<p class="vm-call-big">' + fmtMoney(c.strike) + " <span>or less</span></p>" +
      '<p class="vm-call-sub">' + [packTxt ? "for " + packTxt : "", c.strikeUnit != null ? fmtUnit(c.strikeUnit) + " per " + esc(u) : ""].filter(Boolean).join(" · ") + "</p>" +
      (r.diminishing_returns.knee_unit_price != null ? '<p class="vm-call-note">Category sweet spot: ' + fmtUnit(r.diminishing_returns.knee_unit_price) + " per " + esc(u) + "</p>" : "");
    var lines = [];
    if (c.now != null) lines.push("Now <b>" + money(c.now) + "</b>" + (c.retailer ? " at " + esc(c.retailer) : "") + (g ? " · " + esc(g.text) : ""));
    else if (c.retailer) lines.push("At " + esc(c.retailer) + " · no current price found");
    if (c.action === "WAIT" && c.waitFor) lines.push("Watch for: " + esc(c.waitFor));
    var alt = c.alt && c.alt.buy_under != null ? '<p class="vm-call-alt">Prefer ' + esc(c.alt.name) + "? Wait for " + pMoney(c.alt, c.alt.buy_under) + (c.alt.street_price != null ? " (now " + pMoney(c.alt, c.alt.street_price) + ")" : "") + ".</p>" : "";
    var actCol = '<p class="vm-call-k">' + (strikeCol ? "2 · " : "") + "Our call</p>" +
      '<p class="vm-call-verb vm-tone-' + m.cls + '">' + esc(m.verb) + "</p>" +
      (c.action !== "SKIP" && c.name ? '<p class="vm-call-item">' + esc(c.name) + "</p>" : "") +
      lines.map(function (l) { return '<p class="vm-call-line">' + l + "</p>"; }).join("") +
      (c.why ? '<p class="vm-call-why">' + esc(c.why) + "</p>" : "") + alt;
    if (o.doc) return '<table class="q-cols doc-call" cellspacing="0" cellpadding="0"><tr>' + (strikeCol ? "<td>" + strikeCol + "</td>" : "") + "<td>" + actCol + "</td></tr></table>";
    return '<div class="vm-call' + (strikeCol ? "" : " vm-call-one") + '">' + (strikeCol ? '<div class="vm-call-strike">' + strikeCol + "</div>" : "") + '<div class="vm-call-act">' + actCol + "</div></div>";
  }

  // Specific offers seen during research, cheapest per unit first.
  function dealsHTML(r, o) {
    o = o || {};
    var u = r.normalization.unit_short;
    var ds = r.deals_found.slice().sort(function (x, y) {
      var ux = x.pack_size ? x.price / x.pack_size : Infinity, uy = y.pack_size ? y.price / y.pack_size : Infinity;
      return ux - uy;
    });
    if (!ds.length) return "";
    return '<div class="q-wrap"><table class="q-table vm-deals" cellspacing="0" cellpadding="0"><thead><tr><th>Offer</th><th class="r">Price</th><th>Where</th></tr></thead><tbody>' +
      ds.slice(0, 8).map(function (x) {
        var unit = x.pack_size ? fmtUnit(x.price / x.pack_size) + " per " + esc(u) : "";
        var where = x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.retailer || "Link") + "</a>" : esc(x.retailer);
        return "<tr><td>" + esc(x.product) + (x.note ? '<small class="vm-deal-note">' + esc(x.note) + "</small>" : "") + '</td><td class="r"><b>' + fmtMoney(x.price) + "</b>" + (unit ? "<small>" + unit + "</small>" : "") + "</td><td>" + where + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<p class="q-sub">Seen' + (r.generated_at ? " " + esc(fmtDate(r.generated_at)) : "") + " while researching. Deals end, so check the price before you buy.</p>";
  }

  // Awards that name the same product collapse into one row: "Budget · Lasts longest".
  function awardGroups(r, order, skipProducts) {
    var seen = {}, out = [];
    (skipProducts || []).forEach(function (nm) { if (nm) seen[String(nm).toLowerCase().trim()] = { skip: true }; });
    order.forEach(function (o) {
      var a = r.awards[o[0]]; if (!a.product) return;
      var k = String(a.product).toLowerCase().trim();
      if (seen[k]) { if (!seen[k].skip && o[0] !== "avoid") seen[k].labels.push(o[1]); return; }
      seen[k] = { key: o[0], labels: [o[1]], a: a }; out.push(seen[k]);
    });
    return out;
  }

  // ============================================================
  // Charts
  // ============================================================
  function diminishingReturnsSVG(dr) {
    var curve = dr.curve.slice().sort(function (a, b) { return a.unit_price - b.unit_price; });
    if (curve.length < 2) return "";
    var W = 640, H = 300, padL = 46, padR = 24, padT = 30, padB = 38;
    var xs = curve.map(function (p) { return p.unit_price; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    if (minX === maxX) maxX = minX + 1;
    function X(v) { return padL + ((v - minX) / (maxX - minX)) * (W - padL - padR); }
    function Y(v) { return H - padB - (Math.max(0, Math.min(100, v)) / 100) * (H - padT - padB); }
    var knee = dr.knee_unit_price;
    var pts = curve.map(function (p) { return { x: X(p.unit_price), y: Y(p.quality), label: p.label, raw: p }; });
    var pathD = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ");
    var kneeX = knee != null ? X(Math.max(minX, Math.min(maxX, knee))) : null;
    var labelSlots = placeLabels(pts.map(function (p) {
      var nearKnee = kneeX != null && Math.abs(p.x - kneeX) < 60;
      return { x: p.x, y: p.y, label: nearKnee || !p.label ? null : trunc(p.label, 30), allowBelow: false };
    }), W, H, (function () {
      // sample the curve itself so labels don't sit on the line
      var s = [];
      for (var i = 1; i < pts.length; i++) {
        var a = pts[i - 1], b = pts[i], steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 6);
        for (var j = 1; j < steps; j++) s.push({ x: a.x + (b.x - a.x) * j / steps, y: a.y + (b.y - a.y) * j / steps });
      }
      return s;
    })());
    var gridY = [0, 25, 50, 75, 100].map(function (v) {
      return '<line x1="' + padL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--rule)" stroke-width="1"/>' +
        '<text x="' + (padL - 8) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--ink-faint)">' + v + "</text>";
    }).join("");
    var xTickVals = [minX, maxX];
    if (knee != null && X(knee) - X(minX) > 50 && X(maxX) - X(knee) > 50) xTickVals.splice(1, 0, knee);
    var xTicks = xTickVals.map(function (v) { return svgLabel(X(v), H - padB + 17, fmtUnit(v), W, { size: 10 }); }).join("");
    var markers = pts.map(function (p, i) {
      var isKnee = knee != null && Math.abs(p.raw.unit_price - knee) < (maxX - minX) * 0.02;
      var r = isKnee ? 6 : 4;
      var label = labelSlots[i] ? svgLabel(labelSlots[i].x, labelSlots[i].y, trunc(p.label, 30), W, { anchor: labelSlots[i].anchor }) : "";
      return (isKnee ? '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (r + 2) + '" fill="var(--card)"/>' : "") +
        '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + r + '" fill="' + (isKnee ? "var(--accent)" : "var(--tier-3)") + '">' +
        "<title>" + esc((p.label ? p.label + " — " : "") + fmtUnit(p.raw.unit_price) + " per unit, quality " + p.raw.quality) + "</title></circle>" + label;
    }).join("");
    var kneeMark = kneeX != null
      ? '<line x1="' + kneeX.toFixed(1) + '" y1="' + padT + '" x2="' + kneeX.toFixed(1) + '" y2="' + (H - padB) + '" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>' +
        svgLabel(kneeX, padT - 9, "Sweet spot " + fmtUnit(knee), W, { size: 11 }).replace('fill="var(--ink-soft)"', 'fill="var(--accent)" font-weight="700"')
      : "";
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" role="img" aria-label="Diminishing returns curve">' +
      gridY + kneeMark +
      '<path d="' + pathD + '" fill="none" stroke="var(--tier-3)" stroke-width="2"/>' +
      markers + xTicks +
      '<text x="' + padL + '" y="12" font-size="11" fill="var(--ink-faint)">Quality (0–100)</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 4) + '" text-anchor="end" font-size="11" fill="var(--ink-faint)">Price per unit →</text>' +
      "</svg>";
  }

  function tierColor(tierOrder, t) {
    var idx = tierOrder.indexOf(t);
    return idx >= 0 ? rampAt(idx, tierOrder.length) : TIER_RAMP[1];
  }

  function scatterSVG(products, tierOrder) {
    var ps = products.filter(function (p) { return p.unit_price != null && p.quality_score != null; });
    if (!ps.length) return "";
    var W = 640, H = 320, padL = 46, padR = 24, padT = 24, padB = 40;
    var xs = ps.map(function (p) { return p.unit_price; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    if (minX === maxX) { minX = minX * 0.9; maxX = maxX * 1.1 || 1; }
    var spanX = maxX - minX; minX -= spanX * 0.04; maxX += spanX * 0.04;
    function X(v) { return padL + ((v - minX) / (maxX - minX)) * (W - padL - padR); }
    function Y(v) { return H - padB - (Math.max(0, Math.min(100, v)) / 100) * (H - padT - padB); }
    var pts = ps.map(function (p) { return { x: X(p.unit_price), y: Y(p.quality_score), p: p }; });
    // Label by brand when it is unique in the report (names like "Watercolor 15ml" repeat across brands).
    var brandCount = {};
    ps.forEach(function (p) { if (p.brand) brandCount[p.brand] = (brandCount[p.brand] || 0) + 1; });
    pts.forEach(function (q) { q.label = trunc(q.p.brand && brandCount[q.p.brand] === 1 ? q.p.brand : q.p.name, 30); });
    var labelSlots = placeLabels(pts.map(function (q) { return { x: q.x, y: q.y, label: q.label }; }), W, H, null, padL + 4);
    var gridY = [0, 25, 50, 75, 100].map(function (v) {
      return '<line x1="' + padL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--rule)" stroke-width="1"/>' +
        '<text x="' + (padL - 8) + '" y="' + (Y(v) + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--ink-faint)">' + v + "</text>";
    }).join("");
    var xTicks = [Math.min.apply(null, xs), Math.max.apply(null, xs)].map(function (v) { return svgLabel(X(v), H - padB + 17, fmtUnit(v), W, { size: 10 }); }).join("");
    var markers = pts.map(function (q, i) {
      return '<circle cx="' + q.x.toFixed(1) + '" cy="' + q.y.toFixed(1) + '" r="7" fill="' + tierColor(tierOrder, q.p.tier) + '" stroke="var(--card)" stroke-width="2">' +
        "<title>" + esc(q.p.name + " — " + fmtUnit(q.p.unit_price) + " per unit, quality " + q.p.quality_score + (q.p.value_score != null ? ", value " + q.p.value_score : "")) + "</title></circle>" +
        (labelSlots[i] ? svgLabel(labelSlots[i].x, labelSlots[i].y, q.label, W, { size: 10, anchor: labelSlots[i].anchor }) : "");
    }).join("");
    var legend = '<div class="vm-chart-legend">' + tierOrder.map(function (t, i) {
      return '<span><span class="vm-swatch" style="border-radius:50%;background:' + rampAt(i, tierOrder.length) + '"></span>' + esc(t) + "</span>";
    }).join("") + "</div>";
    return legend + '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" role="img" aria-label="Quality versus price per unit">' +
      gridY + markers + xTicks +
      '<text x="' + padL + '" y="12" font-size="11" fill="var(--ink-faint)">Quality score ↑  (up and to the left = better value)</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 4) + '" text-anchor="end" font-size="11" fill="var(--ink-faint)">Price per unit →</text>' +
      "</svg>";
  }

  // Price targets on a "% off street price" scale. Absolute prices across a
  // category can span 100x, which squashed a shared dollar axis; the discount
  // you are waiting for is the comparable, decision-relevant number.
  function pctOff(street, price) { return street && price != null ? Math.max(0, (street - price) / street) : null; }
  function priceWatchHTML(products) {
    var ps = products.filter(function (p) { return p.street_price != null && p.buy_under != null; });
    if (!ps.length) return '<p class="vm-footnote">No price targets in this report.</p>';
    // A "discount" above 70% almost always means the street price and the
    // target are in different units (per box vs per item) in the source data.
    function mismatched(p) { return (pctOff(p.street_price, p.buy_under) || 0) > 0.7; }
    var maxOff = 0.3;
    ps.forEach(function (p) {
      if (mismatched(p)) return;
      var lo = pctOff(p.street_price, p.historical_low) || 0;
      maxOff = Math.max(maxOff, pctOff(p.street_price, p.buy_under) || 0, lo <= 0.7 ? lo : 0);
    });
    maxOff = Math.min(0.7, Math.ceil(maxOff * 10) / 10);
    function pos(off) { return (Math.min(1, (off || 0) / maxOff) * 100).toFixed(1) + "%"; }
    var rows = ps.map(function (p) {
      if (mismatched(p)) {
        return '<div class="vm-pw-row"><div class="vm-pw-name">' + esc(p.name) + (p.brand ? "<small>" + esc(p.brand) + "</small>" : "") + "</div>" +
          '<div><p class="vm-pw-text" style="margin-top:0"><b>Buy at ' + fmtMoney(p.buy_under) + " or less</b>" + (p.historical_low != null ? " · lowest seen " + fmtMoney(p.historical_low) : "") +
          '<br><span style="color:var(--ink-faint)">Listed street price ' + fmtMoney(p.street_price) + " looks like a different unit (e.g. per pack), so it isn’t charted.</span></p></div></div>";
      }
      var buyOff = pctOff(p.street_price, p.buy_under), lowOff = pctOff(p.street_price, p.historical_low);
      if (lowOff != null && lowOff > 0.7) lowOff = null;
      var never = buyOff != null && buyOff < 0.005;
      var text = never
        ? "<b>Buy whenever</b> at " + fmtMoney(p.street_price) + " — rarely discounts"
        : "<b>Buy at " + fmtMoney(p.buy_under) + " or less</b> (" + Math.round(buyOff * 100) + "% off " + fmtMoney(p.street_price) + ")";
      if (p.historical_low != null) text += " · lowest seen " + fmtMoney(p.historical_low);
      return '<div class="vm-pw-row"><div class="vm-pw-name">' + esc(p.name) + (p.brand ? "<small>" + esc(p.brand) + "</small>" : "") + "</div>" +
        '<div><div class="vm-pw-track"><span class="vm-pw-base"></span>' +

        (lowOff != null ? '<span class="vm-pw-dot" style="left:' + pos(lowOff) + ';background:var(--tier-2)" title="Lowest seen ' + esc(fmtMoney(p.historical_low)) + '"></span>' : "") +
        '<span class="vm-pw-dot" style="left:' + pos(buyOff) + ';background:var(--status-good)" title="Buy under ' + esc(fmtMoney(p.buy_under)) + '"></span>' +

    }).join("");
    return '<div class="vm-chart-legend">' +
      '<span><span class="vm-swatch" style="border-radius:50%;background:var(--ink-faint)"></span>Street price</span>' +

      '<div class="vm-pw-axis"><span></span><div><span>Full price</span><span>' + Math.round(maxOff * 100) + "% off</span></div></div>" + rows;

  function specBarsHTML(criteria) {
    var sorted = criteria.slice().sort(function (a, b) { return b.weight - a.weight; });

  function tableTwinBlock(id, chartHtml, tableHtml) {

  function tableHTML(headers, rows, opts) {
    opts = opts || {};
    var numCols = opts.num || [];
    return '<table class="vm-table' + (opts.wide ? " vm-wide" : "") + '"><thead><tr>' + headers.map(function (h, i) {

    }).join("") + "</tr></thead><tbody>" + rows.map(function (r) {

  // ============================================================
  // Report rendering (in-app view)
  // ============================================================
  function signalMeta(v) { return SIGNAL_META[v.signal] || null; }
  function signalBadge(v) {
    var m = signalMeta(v); if (!m) return "";
    return '<span class="vm-signal-badge" style="background:color-mix(in srgb, var(--status-' + m.color + ') 16%, transparent);color:var(--status-' + m.color + ')">' + m.icon + " " + m.label + "</span>";
  }

  // ------------------------------------------------------------
  // Text helpers for the Quick read: take whole sentences, never cut mid-thought.
  // ------------------------------------------------------------
  function firstSentence(s) {
    s = String(s || "").replace(/\s+/g, " ").trim();
    var re = /[.!?](?=\s+[A-Z0-9$“"(])/g, m;
    while ((m = re.exec(s))) {
      var before = s.slice(0, m.index).split(" ").pop().toLowerCase();
      if (/^(e\.g|i\.e|vs|approx|etc|inc|no|st|mr|ms|dr|ca|fig|sr|jr|u\.s|oz|lb|lbs|in|ft)$/.test(before) || /^[a-z]$/.test(before)) continue;
      return s.slice(0, m.index + 1);
    }
    return s;
  }

  // Award and call names rarely match a product row exactly ("Tide Free &
  // Gentle 102 ct" vs "Tide Free & Gentle Pods, 102 ct"): fall back to words.
  var MATCH_STOP = { the: 1, and: 1, of: 1, with: 1, pods: 1, pod: 1, pack: 1, count: 1, ct: 1 };
  function matchWords(x) { return String(x || "").toLowerCase().replace(/&/g, " ").split(/[^a-z0-9]+/).filter(function (w) { return w && !MATCH_STOP[w]; }); }
  function matchProduct(products, name) {
    var n = String(name || "").toLowerCase();
    if (!n) return null;
    var exact = products.filter(function (p) {
      var pn = String(p.name || "").toLowerCase();
      var full = (String(p.brand || "") + " " + pn).toLowerCase().trim();
      return pn && (n.indexOf(pn) >= 0 || pn.indexOf(n) >= 0 || n.indexOf(full) >= 0);
    })[0];
    if (exact) return exact;
    var nw = matchWords(n.split(/\s+\/\s+|\s+or\s+|\(/)[0]);
    if (nw.length < 2) return null;
    var best = null, bestScore = 0;
    products.forEach(function (p) {
      var pw = matchWords(p.brand + " " + p.name), hit = nw.filter(function (w) { return pw.indexOf(w) >= 0; }).length;
      var score = hit / nw.length;
      if (score > bestScore) { bestScore = score; best = p; }
    });
    return bestScore >= 0.85 ? best : null;
  }

  function readingMinutes(html) {
    var words = String(html || "").replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 230));
  }

  // The 5-minute version: verdict, picks, price, what to check, targets, timing,
  // shopping lists. Same markup feeds the app (o.doc false) and the exported
  // document (o.doc true: tables for side-by-side so Word lays it out too).
  function renderQuick(r, o) {
    o = o || {};
    var v = r.verdict, dr = r.diminishing_returns, n = r.normalization, d = r.deal_intelligence, a = r.awards;
    var out = "";
    function h(title) { return '<h2 class="q-h">' + esc(title) + "</h2>"; }
    function cols(left, right) {
      if (!left || !right) return left || right || "";
      return o.doc
        ? '<table class="q-cols" cellspacing="0" cellpadding="0"><tr><td>' + left + "</td><td>" + right + "</td></tr></table>"
        : '<div class="q-cols"><div>' + left + "</div><div>" + right + "</div></div>";
    }
    function pill() {
      var sm = signalMeta(v); if (!sm) return "";
      if (!o.doc) return signalBadge(v);
      var c = DOC_SIGNAL_COLORS[sm.color];
      return '<span class="doc-pill" style="color:' + c[0] + ";background:" + c[1] + '">' + sm.icon + " " + esc(sm.label) + "</span>";
    }

    var headline = v.headline || firstSentence(v.reasoning);
    var timing = firstSentence(v.price_watch_summary);
    if (timing === headline) timing = "";
    // The call below is the recommendation; the older timing badge only shows without one.
    var qCall = callHTML(r, o), qPill = qCall ? "" : pill();
    out += '<section class="q-verdict"><p class="q-label">The verdict</p>' +
      (headline ? '<p class="q-headline">' + esc(headline) + "</p>" : "") +
      (qPill || timing ? '<p class="q-meta">' + qPill + (timing ? " <span>" + esc(timing) + "</span>" : "") + "</p>" : "") +
      qCall + "</section>";
    var deals = dealsHTML(r, o);
    if (deals) out += h("Deals found") + deals;

    function pick(label, aw, cls) {
      if (!aw.product) return "";
      var p = matchProduct(r.products, aw.product);
      var price = "";
      if (p && p.buy_under != null) {
        var off = pctOff(p.street_price, p.buy_under);
        price = '<p class="q-pick-price">Buy at <b>' + pMoney(p, p.buy_under) + "</b> or less" + (off && off >= 0.005 && off <= 0.7 ? " · street " + pMoney(p, p.street_price) : "") + "</p>";
      }
      return '<div class="q-pick ' + cls + '"><p class="q-pick-label">' + esc(label) + '</p><p class="q-pick-name">' + esc(aw.product) + "</p>" +
        (aw.why ? '<p class="q-pick-why">' + esc(firstSentence(aw.why)) + "</p>" : "") + price + "</div>";
    }
    var picks = cols(pick("Best of class", a.best_overall, "q-pick-a"), pick("Best value", a.best_value, "q-pick-b"));
    var others = awardGroups(r, [["best_budget", "Budget"], ["best_premium", "Premium"], ["best_for_beginners", "Beginners"], ["longest_lasting", "Lasts longest"], ["avoid", "Avoid"]], [a.best_overall.product, a.best_value.product]);
    if (picks || others.length) {
      out += h("Top picks") + picks;
      if (others.length) out += '<table class="q-list" cellspacing="0" cellpadding="0">' + others.map(function (x) {
        return "<tr" + (x.key === "avoid" ? ' class="q-avoid"' : "") + "><td>" + esc(x.labels.join(" · ")) + "</td><td>" + esc(x.a.product) + "</td></tr>";
      }).join("") + "</table>";
    }

    if (dr.knee_unit_price != null || r.tiers.length) {
      out += h("What to pay");
      var qEx = kneeExamples(r);
      if (dr.knee_unit_price != null) out += '<p class="q-big">Sweet spot <b>' + fmtUnit(dr.knee_unit_price) + "</b> per " + esc(n.unit_short) + "</p>" +
        (qEx.length ? '<p class="q-sub">In real packs: ' + qEx.map(function (x) { return "<b>" + esc(x.text) + "</b> (" + esc(x.p.name) + ")"; }).join(" · ") + "</p>"
          : dr.knee_example ? '<p class="q-sub">' + esc(firstSentence(dr.knee_example)) + "</p>" : "");
      if (r.tiers.length) out += '<table class="q-list" cellspacing="0" cellpadding="0">' + r.tiers.map(function (t) {
        return "<tr><td>" + esc(t.tier) + "</td><td>" + esc(t.price_range) + "</td></tr>";
      }).join("") + "</table>";
    }

    var look = r.primer.must_haves.slice(0, 5).map(function (x) { return x.feature; }).filter(Boolean);
    var skipSeen = {};
    var skip = r.primer.avoid.slice(0, 3).map(function (x) { return x.thing; }).concat(r.value_traps.slice(0, 3).map(function (t) { return t.trap; }))
      .filter(function (x) { var k = String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); if (!k || skipSeen[k]) return false; skipSeen[k] = 1; return true; }).slice(0, 5);
    function ul(items) { return '<ul class="q-ul">' + items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; }
    if (look.length || skip.length) {
      out += h("Check before you buy") + cols(
        look.length ? '<p class="q-col-h q-good">✓ Look for</p>' + ul(look) : "",
        skip.length ? '<p class="q-col-h q-bad">✕ Skip</p>' + ul(skip) : "");
    }

    var ps = r.products.filter(function (p) { return p.buy_under != null; })
      .sort(function (x, y) { return (y.value_score || 0) - (x.value_score || 0); }).slice(0, 6);
    if (ps.length) {
      var anyAt = ps.some(atStrike);
      out += h("Price targets") + '<p class="q-sub">Best value first. Buy at the target price or lower' + (anyAt ? "; ✓ means it’s there today." : ".") + "</p>" +
        '<div class="q-wrap"><table class="q-table" cellspacing="0" cellpadding="0"><thead><tr><th>Product</th><th class="r">Target</th><th class="r">Now</th></tr></thead><tbody>' +
        ps.map(function (p) {
          var off = pctOff(p.street_price, p.buy_under), ok = atStrike(p);
          var store = p.where_to_buy[0] && p.where_to_buy[0].length <= 40 ? '<small class="vm-deal-note">' + esc(p.where_to_buy[0]) + "</small>" : "";
          return "<tr><td>" + esc(p.name) + store + '</td><td class="r"><b>' + pMoney(p, p.buy_under) + '</b></td><td class="r' + (ok ? " q-ok" : "") + '">' + (off != null && off <= 0.7 ? (ok ? "✓ " : "") + pMoney(p, p.street_price) : "N/A") + "</td></tr>";
        }).join("") + "</tbody></table></div>" + (priceKeyNote(ps) ? '<p class="q-sub">' + esc(priceKeyNote(ps)) + "</p>" : "");
    }

    if (d.best_time_to_buy || d.sale_cadence.length) {
      out += h("When to buy") + (d.best_time_to_buy ? "<p>" + esc(firstSentence(d.best_time_to_buy)) + "</p>" : "") +
        (d.sale_cadence.length ? '<ul class="q-chips">' + d.sale_cadence.slice(0, 6).map(function (c) {
          return "<li><b>" + esc(c.event) + "</b>" + (c.timing ? " · " + esc(firstSentence(c.timing).replace(/[.;]$/, "")) : "") + "</li>";
        }).join("") + "</ul>" : "");
    }

    if (r.purchase_paths.length) {
      out += h("Shopping lists") + '<div class="q-paths">' + r.purchase_paths.map(function (p) {
        return '<div class="q-path"><p class="q-path-head">' + esc(p.name) + (p.total_cost != null ? " <span>" + fmtMoney(p.total_cost) + "</span>" : "") + "</p>" +
          (p.items.length ? "<p>" + p.items.map(function (it) { return esc(it.item); }).join(" + ") + "</p>" : "") + "</div>";
      }).join("") + "</div>";
    }
    return out;
  }

  function renderHero(r, short) {
    return '<div class="vm-summary-top">' +
      '<p class="vm-summary-kicker">Value Maxxing · ' + (short ? "Quick read" : "Full report") + "</p>" +

  function renderSummary(r) {
    var v = r.verdict;
    var shortPws = v.price_watch_summary && v.price_watch_summary.length <= 170 ? v.price_watch_summary : "";
    var headline = v.headline || shortPws;
    var pws = v.price_watch_summary && v.price_watch_summary !== headline ? (shortPws || firstSentence(v.price_watch_summary)) : "";
    var awards = awardGroups(r, [["best_budget", "Best budget"], ["best_premium", "Best premium"], ["best_for_beginners", "Best for beginners"], ["longest_lasting", "Lasts longest"], ["avoid", "Avoid"]],
      [r.awards.best_overall.product, r.awards.best_value.product]).map(function (g) {
      var a = g.a, av = g.key === "avoid";
      return '<div class="vm-award' + (av ? " vm-avoid" : "") + '"><p class="vm-award-label">' + (av ? "✕ " : "") + esc(g.labels.join(" · ")) + '</p><p class="vm-award-product">' + esc(a.product) + "</p>" +
        (a.why ? '<p class="vm-award-why">' + esc(firstSentence(a.why)) + "</p>" : "") + "</div>";
    }).join("");

        (v.confidence ? '<p class="vm-summary-conf">Confidence: ' + esc(firstSentence(v.confidence)) + "</p>" : "") +
      "</div></div>" +

      '<div class="vm-summary-picks"><div class="vm-h2h">' +
        '<div class="vm-h2h-col vm-h2h-overall"><p class="vm-h2h-label">Best of class</p><p class="vm-h2h-product">' + esc(overall.product || "—") + '</p><p class="vm-h2h-why">' + esc(overall.why || "") + "</p></div>" +
        '<div class="vm-h2h-divider">vs</div>' +
        '<div class="vm-h2h-col vm-h2h-value"><p class="vm-h2h-label">Best value</p><p class="vm-h2h-product">' + esc(value.product || "—") + '</p><p class="vm-h2h-why">' + esc(value.why || "") + "</p></div>" +
      "</div>" + (awards ? '<div class="vm-awards">' + awards + "</div>" : "") + "</div>" +
    "</section>";
  }

  function renderReport(r, expertise, opts) {
    opts = opts || {};
    var mode = opts.mode === "full" ? "full" : "quick";
    var tierOrder = r.tiers.map(function (t) { return t.tier; });
    var openSet = OPEN_DEFAULTS[expertise] || OPEN_DEFAULTS.intermediate;
    var takeaways = buildTakeaways(r);

    var quickBody = renderQuick(r, {});
    var sectionsAll = "";
    var main = REPORT_PARTS.map(function (part) {
      return '<div class="vm-part" id="part-' + part.id + '"><div class="vm-part-row"><span class="vm-part-num">' + esc(part.label) + '</span><h3 class="vm-part-title">' + esc(part.title) + '</h3><span class="vm-part-rule"></span></div>' +
        '<p class="vm-part-desc">' + esc(part.desc) + "</p></div>" +
        part.sections.map(function (id) {
          var s = SECTION_META[id], body = renderSectionBody(id, r, tierOrder);

    var summary = renderSummary(r);

          (IS_ARTIFACT ? "" : '<button type="button" data-dl="pdf"><b>PDF</b><small>Opens the print dialog</small></button>') +
          '<button type="button" data-dl="word"><b>Word (.docx)</b><small>Word, Pages, Google Docs</small></button>' +
        "</div></div>" +
      "</div></div>";

    var recovered = (r._recovered && !DEMO ? '<p class="vm-recovered">Recovered from an older export, which didn’t store the one-line verdict.</p>' : "") +
      (r.price_source === "estimate" ? '<p class="vm-recovered vm-estimate"><b>Estimated prices.</b> From Claude’s own knowledge, not checked live. Verify before buying.</p>' : "");

    if (mode === "quick") {

        '<article class="vm-summary vm-quick">' + renderHero(r, true) + '<div class="vm-quick-body">' + quickBody + calcHTML(r) +
        '<p class="q-cta">Want the reasoning, specs and every product? <button class="vm-link-btn" type="button" data-mode="full">Open the full report →</button></p>' +
        "</div></article>" +
        '<div class="vm-end-actions"><button class="vm-btn-ghost" type="button" id="vm-new-report">New report</button></div>';

      '<div class="vm-analysis-head"><h2>Full analysis</h2><span></span><button class="vm-link-btn" type="button" id="vm-collapse-all">Collapse all</button></div>' +
      '<div class="vm-report-layout"><div class="vm-report-toc-col">' + renderTOC(takeaways) + "</div>" +
      '<div class="vm-report-main">' + main + "</div></div>";

  function renderPrimer(p) {

  function notes2(pairs) {

  function renderPriceExpectations(dr, n, tiers, r) {
    var bands = n.bands.slice().sort(function (x, y) { return x.low - y.low; }), ladderHtml = "";
    if (bands.length) {
      // Bands are drawn equal-width (ordinal), not proportional: one open-ended
      // band (e.g. "$0.50–$99") would otherwise squash every other band to a sliver.
      var w = 100 / bands.length;
      var segs = bands.map(function (b, i) {
        return '<div class="vm-ladder-seg" style="width:' + w.toFixed(3) + "%;background:" + rampAt(i, bands.length) + '" title="' + esc(b.label + ": " + fmtUnit(b.low) + "–" + fmtUnit(b.high)) + '">' + (w >= 16 && b.label.length <= 16 ? esc(b.label) : "") + "</div>";
      }).join("");
      var kneeMarker = "";
      var k = dr.knee_unit_price;
      if (k != null) {
        var idx = -1;
        bands.forEach(function (b, i) { if (idx < 0 && k >= b.low && k <= b.high) idx = i; });
        var kp = idx < 0 ? (k < bands[0].low ? 0 : 100) : (idx + (bands[idx].high > bands[idx].low ? (k - bands[idx].low) / (bands[idx].high - bands[idx].low) : 0.5)) * w;
        kp = Math.max(0, Math.min(100, kp));
        var lblStyle = kp < 12 ? "left:" + kp.toFixed(1) + "%;transform:translateX(-4px)" : kp > 88 ? "right:" + (100 - kp).toFixed(1) + "%;transform:translateX(4px)" : "left:" + kp.toFixed(1) + "%;transform:translateX(-50%)";
        kneeMarker = '<div class="vm-ladder-knee" style="' + lblStyle + '">Sweet spot ' + fmtUnit(k) + '</div><div class="vm-ladder-knee-line" style="left:' + kp.toFixed(1) + '%"></div>';
      }
      ladderHtml = '<div class="vm-ladder-wrap"><div class="vm-ladder">' + segs + kneeMarker + "</div>" +
        '<div class="vm-ladder-ticks"><span>Cheaper per ' + esc(n.unit_short) + "</span><span>Pricier</span></div>" +
        '<div class="vm-ladder-legend">' + bands.map(function (b, i) {

    return (dr.knee_unit_price != null ? '<p class="vm-priceexp-headline">Aim for about ' + fmtUnit(dr.knee_unit_price) + " per " + esc(n.unit_short) + "</p>" : "") +

      (dr.knee_example && !peEx ? '<p class="vm-priceexp-sub">' + (dr.knee_example.length <= 90 ? "That’s roughly what " + esc(dr.knee_example) + " costs — the point where paying more stops buying much more quality." : "<b style=\"color:var(--ink)\">Benchmark:</b> " + esc(dr.knee_example)) + "</p>" : "") +

        else if (i === 2 || i === 6) shown = v == null ? '<span class="vm-na">N/A</span>' : (i === 6 ? "<b>" : "") + pMoney(p, v) + (i === 6 ? "</b>" : "");
        else if (i === 3) shown = v == null ? '<span class="vm-na">N/A</span>' : pUnit(p, v);
        else shown = v == null || v === "" ? "—" : esc(v);
        return "<td" + (c[2] === "num" ? ' class="vm-num-cell"' : "") + ' data-v="' + esc(v == null ? "" : v) + '">' + shown + "</td>";
      }).join("") + "</tr>";
    }).join("");
    var key = priceKeyNote(products);
    return '<div class="vm-table-wrap"><table class="vm-table vm-wide vm-compare"><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>" +

    return (signalMeta(v) || v.price_watch_summary ? '<div class="vm-timing-badge">' + signalBadge(v) + (v.price_watch_summary ? '<span class="vm-timing-note">' + esc(v.price_watch_summary) + "</span>" : "") + "</div>" : "") +
